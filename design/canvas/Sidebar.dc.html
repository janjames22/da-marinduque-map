<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 248px; height: 100%; min-height: 960px; box-sizing: border-box; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(170deg, #0f3f22, #1b6b3f); color: #ffffff; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; color: #ffffff; text-decoration: none;">
    <span style="width: 40px; height: 40px; flex: none; border-radius: 8px; background: #f8dc8a; color: #0f3f22; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-7.5 7-13a7 7 0 0 0-14 0c0 5.5 7 13 7 13zM12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column;"><strong style="font-size: 16px; line-height: 20px; font-weight: 600;">Intervention Map</strong><span style="font-size: 12px; line-height: 16px; color: #c3e6cf;">Provincial Agriculture Office Marinduque</span></span>
  </a>
  <sc-for list="{{groups}}" as="group" hint-placeholder-count="4">
    <div style="padding: 16px 12px 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: #c3e6cf;">{{group.label}}</div>
    <sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
      <sc-if value="{{item.isCurrent}}" hint-placeholder-val="{{false}}">
        <a href="{{item.href}}" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; background: #ffffff; color: #0f3f22; font-weight: 600; text-decoration: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
      </sc-if>
      <sc-if value="{{item.notCurrent}}" hint-placeholder-val="{{true}}">
        <a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; color: #ffffff; font-weight: 500; text-decoration: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
      </sc-if>
    </sc-for>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","dashboard","map","records","qa","condition","import","reports","users","types","lists","signatures","audit"],"default":"home"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'home';
    const groups = [
      { label: 'Overview', items: [
        { id: 'home', label: 'Home', href: 'Main.dc.html', d: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z' },
        { id: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html', d: 'M3 3v18h18M8 17v-5M13 17V7M18 17v-8' },
        { id: 'map', label: 'Map', href: 'Map.dc.html', d: 'M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3zM9 4v13M15 7v13' },
      ] },
      { label: 'Records', items: [
        { id: 'records', label: 'Interventions', href: 'Records.dc.html', d: 'M3 12h18M3 6h18M3 18h12' },
        { id: 'qa', label: 'QA queue', href: 'Records.dc.html', d: 'm3 6 2 2 4-4M3 14l2 2 4-4M13 6h8M13 14h8M13 20h8' },
        { id: 'condition', label: 'Condition check', href: 'Records.dc.html', d: 'M12 14l4-4M3.3 19a10 10 0 1 1 17.4 0' },
        { id: 'import', label: 'Import', href: 'Records.dc.html', d: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M12 18v-6M9 15l3-3 3 3' },
      ] },
      { label: 'Reports', items: [
        { id: 'reports', label: 'Reports', href: 'Dashboard.dc.html', d: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5' },
      ] },
      { label: 'Administration', items: [
        { id: 'users', label: 'Users', href: 'Main.dc.html', d: 'M16 21a7 7 0 0 0-14 0M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21a7 7 0 0 0-4-6.3M16 3.5a4 4 0 0 1 0 7.8' },
        { id: 'types', label: 'Types and fields', href: 'Main.dc.html', d: 'M3 3h8v8H3zM17 13a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM17 3l4 7h-8z' },
        { id: 'lists', label: 'Lists', href: 'Main.dc.html', d: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01' },
        { id: 'signatures', label: 'Signature blocks', href: 'Main.dc.html', d: 'M3 21h18M5 17 15 7l3 3-10 10H5z' },
        { id: 'audit', label: 'Audit log', href: 'Main.dc.html', d: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2' },
      ] },
    ];
    return {
      groups: groups.map((group) => ({
        ...group,
        items: group.items.map((item) => ({ ...item, isCurrent: item.id === current, notCurrent: item.id !== current })),
      })),
    };
  }
}
</script>
</body>
</html>
